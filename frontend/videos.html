<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamVault — Videos</title>
<style>
:root {
  --bg: #0b0d12;
  --bg-glow: #141826;
  --card: #12151d;
  --border: #232838;
  --text: #eef1f7;
  --muted: #8891a7;
  --accent: #ff3b5c;
  --accent-soft: rgba(255, 59, 92, 0.18);
  --error: #ff6b6b;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  background: radial-gradient(1200px 600px at 80% -10%, var(--bg-glow), transparent 60%), var(--bg);
  color: var(--text);
  padding: 32px 24px;
}
.wrap { max-width: 960px; margin: 0 auto; }
.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-size: 13px; }
.brand-name { font-size: 18px; font-weight: 700; }
.logout-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.logout-btn:hover { color: var(--text); border-color: var(--muted); }
.status { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
.status.error { color: var(--error); }
.player-box { background: #000; border-radius: 14px; overflow: hidden; margin-bottom: 28px; border: 1px solid var(--border); display: none; }
.player-box.active { display: block; }
video { width: 100%; display: block; max-height: 480px; }
.now-playing { padding: 12px 16px; font-size: 13.5px; color: var(--muted); background: var(--card); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.video-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; cursor: pointer; transition: border-color .15s ease, transform .05s ease; }
.video-card:hover { border-color: var(--accent); }
.video-card:active { transform: scale(0.99); }
.video-card .icon { width: 36px; height: 36px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; margin-bottom: 12px; font-size: 14px; }
.video-card .title { font-size: 13.5px; line-height: 1.4; word-break: break-word; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <span class="brand-mark">▶</span>
        <span class="brand-name">StreamVault</span>
      </div>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
    <p class="status" id="status">Loading videos...</p>
    <div class="player-box" id="playerBox">
      <video id="player" controls></video>
      <div class="now-playing" id="nowPlaying"></div>
    </div>
    <div class="grid" id="videoGrid"></div>
  </div>

  <script>
    const token = localStorage.getItem("token");
    const API_BASE_URL = localStorage.getItem("apiBaseUrl") || "http://streamvault.eastus.cloudapp.azure.com";

    const statusEl = document.getElementById("status");
    const gridEl = document.getElementById("videoGrid");
    const playerBox = document.getElementById("playerBox");
    const player = document.getElementById("player");
    const nowPlaying = document.getElementById("nowPlaying");

    // If there's no token, send the user back to the login page
    if (!token) {
      window.location.href = "index.html";
    }

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("token");
      localStorage.removeItem("apiBaseUrl");
      window.location.href = "index.html";
    });

    async function loadVideos() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/videos`, {
          headers: { Authorization: `Bearer ${token}` },
        });

        if (res.status === 401 || res.status === 403) {
          // Token is invalid or expired
          localStorage.removeItem("token");
          window.location.href = "index.html";
          return;
        }

        const data = await res.json();

        if (!res.ok) {
          statusEl.textContent = data.message || "Could not load videos.";
          statusEl.classList.add("error");
          return;
        }

        if (!data.videos || data.videos.length === 0) {
          statusEl.textContent = "No videos are available yet.";
          return;
        }

        statusEl.textContent = `${data.videos.length} video(s) found.`;
        renderVideos(data.videos);
      } catch (err) {
        statusEl.textContent = "Could not connect to the server.";
        statusEl.classList.add("error");
      }
    }

    function renderVideos(videos) {
      gridEl.innerHTML = "";
      videos.forEach((video) => {
        const card = document.createElement("div");
        card.className = "video-card";
        card.innerHTML = `
          <div class="icon">▶</div>
          <div class="title">${escapeHtml(video.name)}</div>
        `;
        card.addEventListener("click", () => playVideo(video));
        gridEl.appendChild(card);
      });
    }

    function playVideo(video) {
      // The token is passed as a query parameter because the <video> tag
      // cannot send a custom Authorization header.
      player.src = `${API_BASE_URL}${video.url}?token=${token}`;
      nowPlaying.textContent = video.name;
      playerBox.classList.add("active");
      player.play();
      playerBox.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    loadVideos();
  </script>
</body>
</html>
